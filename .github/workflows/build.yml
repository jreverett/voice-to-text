name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build mic-capture (self-contained single-file)
        run: dotnet publish tools\mic-capture -c Release -o build\bin -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # Download AHK v2 portable
          $ahkRelease = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          $ahkZip = $ahkRelease.assets | Where-Object { $_.name -match "AutoHotkey.*\.zip$" } | Select-Object -First 1
          Invoke-WebRequest $ahkZip.browser_download_url -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          # Download Ahk2Exe
          $compilerRelease = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $compilerZip = $compilerRelease.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1
          Invoke-WebRequest $compilerZip.browser_download_url -OutFile ahk2exe.zip
          Expand-Archive ahk2exe.zip -DestinationPath ahk\Compiler

      - name: Compile AHK to exe
        shell: pwsh
        run: |
          $ahk2exe = Get-ChildItem "ahk\Compiler" -Filter "Ahk2Exe.exe" -Recurse | Select-Object -First 1
          if (!$ahk2exe) { throw "Ahk2Exe.exe not found in downloaded archive" }
          Write-Host "Using Ahk2Exe: $($ahk2exe.FullName)"
          # Find the 64-bit base file
          $base = Get-ChildItem "ahk" -Filter "AutoHotkey64.exe" -Recurse | Select-Object -First 1
          $baseArg = if ($base) { "/base `"$($base.FullName)`"" } else { "" }
          $expr = "& `"$($ahk2exe.FullName)`" /in `"voice-to-text.ahk`" /out `"build\voice-to-text.exe`" /icon `"icons\app.ico`" $baseArg /silent"
          Write-Host "Running: $expr"
          Invoke-Expression $expr

      - name: Download whisper.cpp (OpenBLAS)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "whisper-blas-bin-x64\.zip$" } | Select-Object -First 1
          if (!$asset) {
            $asset = $release.assets | Where-Object { $_.name -match "whisper.*bin.*x64\.zip$" -and $_.name -notmatch "cublas|cuda|openblas|arm" } | Select-Object -First 1
          }
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest $asset.browser_download_url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper-extract
          Get-ChildItem whisper-extract -Recurse -File | Where-Object {
            $_.Name -eq "whisper-server.exe" -or $_.Extension -eq ".dll"
          } | ForEach-Object {
            Copy-Item $_.FullName "build\bin\$($_.Name)" -Force
          }

      - name: Generate icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Path "build\icons" -Force | Out-Null
          $colors = @{
            "idle"         = @(34, 197, 94)
            "starting"     = @(251, 146, 60)
            "recording"    = @(239, 68, 68)
            "transcribing" = @(250, 204, 21)
          }
          foreach ($name in $colors.Keys) {
            $rgb = $colors[$name]
            $bmp = New-Object System.Drawing.Bitmap(32, 32, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear([System.Drawing.Color]::Transparent)
            $color = [System.Drawing.Color]::FromArgb(255, $rgb[0], $rgb[1], $rgb[2])
            $brush = New-Object System.Drawing.SolidBrush($color)
            $g.FillEllipse($brush, 2, 2, 28, 28)
            $darker = [System.Drawing.Color]::FromArgb(255, [Math]::Max(0,$rgb[0]-40), [Math]::Max(0,$rgb[1]-40), [Math]::Max(0,$rgb[2]-40))
            $pen = New-Object System.Drawing.Pen($darker, 1.5)
            $g.DrawEllipse($pen, 2, 2, 28, 28)
            $g.Dispose(); $brush.Dispose(); $pen.Dispose()
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $pngBytes = $ms.ToArray(); $ms.Dispose(); $bmp.Dispose()
            $fs = [System.IO.File]::Create("build\icons\$name.ico")
            $bw = New-Object System.IO.BinaryWriter($fs)
            $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]1)
            $bw.Write([byte]32); $bw.Write([byte]32); $bw.Write([byte]0); $bw.Write([byte]0)
            $bw.Write([UInt16]1); $bw.Write([UInt16]32)
            $bw.Write([UInt32]$pngBytes.Length); $bw.Write([UInt32]22)
            $bw.Write($pngBytes)
            $bw.Close(); $fs.Close()
          }
          Copy-Item "icons\app.ico" "build\icons\app.ico"

      - name: Create default config
        shell: pwsh
        run: |
          @"
          [Audio]
          MicDevice=
          FollowWindowsDefault=true

          [Paths]
          MicCapturePath=bin\mic-capture.exe
          WhisperServerPath=bin\whisper-server.exe
          ModelPath=models\ggml-small.en.bin
          TempWav=temp\recording.wav

          [Hotkey]
          PushToTalk=ShiftAlt
          AutoHeadsetToggle=true
          HeadsetDeviceMatch=EarPods

          [Startup]
          RunAtLogin=true
          RunAsAdministrator=false

          [Transcription]
          Engine=Groq

          [Whisper]
          Threads=8
          ServerPort=8178

          [Groq]
          Model=whisper-large-v3-turbo
          Language=en

          [Send]
          Enabled=false
          RuleCount=1
          Rule1Word=go
          Rule1Keys={Enter}

          [TabNavigation]
          Enabled=true
          TargetProcess=WindowsTerminal.exe
          "@ | Set-Content "build\config.ini" -NoNewline

      - name: Create directory structure
        run: |
          New-Item -ItemType Directory -Path "build\models" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\temp" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\licenses" -Force | Out-Null
          Copy-Item "lib\WebView2Loader.dll" "build\lib\WebView2Loader.dll"
          Copy-Item "lib\ahk2_lib.LICENSE.txt" "build\licenses\ahk2_lib.LICENSE.txt"
          Copy-Item "lib\WebView2.LICENSE.txt" "build\licenses\WebView2.LICENSE.txt"
          Copy-Item "lib\WebView2.NOTICE.txt" "build\licenses\WebView2.NOTICE.txt"
          Copy-Item "ui" "build\ui" -Recurse

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\*" -DestinationPath "voice-to-text.zip"

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          # Split on version headings ("## ...") and take the first section.
          $parts = $content -split "(?m)^## "
          if ($parts.Count -gt 1) {
            $notes = "## " + $parts[1].TrimEnd()
          } else {
            $notes = "Release $env:TAG"
          }
          Set-Content -Path release-notes.md -Value $notes -NoNewline

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
          files: voice-to-text.zip
